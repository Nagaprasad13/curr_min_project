version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: carebridge-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - carebridge-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carebridge-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/hospital_referral
      - JWT_SECRET=carebridge_super_secure_jwt_secret_key_change_in_production
      - JWT_EXPIRES_IN=1h
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      - mongodb
    networks:
      - carebridge-network

  ml-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: carebridge-ml-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    networks:
      - carebridge-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carebridge-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - carebridge-network

volumes:
  mongo-data:

networks:
  carebridge-network:
    driver: bridge
